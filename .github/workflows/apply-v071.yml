name: Apply v0.7.1 Stability Patch
# trigger validated patch application

on:
  push:
    branches:
      - fix/v0.7.1-windows-quic-stability
    paths:
      - ".github/workflows/apply-v071.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Apply patch
        run: |
          set -euo pipefail
          git apply -p1 --whitespace=nowarn .github/patches/v0.7.1.patch
          gofmt -w data.go lineedit.go main_test.go session.go transfer.go types.go util.go

      - name: Validate
        run: |
          set -euo pipefail
          go mod download
          go test ./...
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/p2p-friend-linux-amd64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/p2p-friend-windows-amd64.exe .
          GOOS=windows GOARCH=amd64 go test -c -o /tmp/p2p-friend-windows.test.exe .

      - name: Commit validated patch
        run: |
          set -euo pipefail
          git rm .github/patches/v0.7.1.patch
          git rm .github/workflows/apply-v071.yml
          git rm .github/workflows/v071-source-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize Windows QUIC transfer and terminal prompt"
          git push origin HEAD:fix/v0.7.1-windows-quic-stability
