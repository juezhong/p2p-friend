name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/p2p-friend-linux-amd64 .

      - name: Build Linux arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/p2p-friend-linux-arm64 .

      - name: Build Windows amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/p2p-friend-windows-amd64.exe .

      - name: Compile Windows amd64 tests
        run: GOOS=windows GOARCH=amd64 go test -c -o /tmp/p2p-friend-windows.test.exe .

      - name: Build macOS amd64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /tmp/p2p-friend-darwin-amd64 .

      - name: Build macOS arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/p2p-friend-darwin-arm64 .

  linux-long-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Sustained resilient LAN transfer
        env:
          P2PF_LONG_TRANSFER_TEST: "1"
        run: go test -run TestQUICLoopbackParallelTransfer -count=1 -timeout=8m .

  windows-long-transfer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Sustained QUIC transfer
        shell: pwsh
        env:
          P2PF_LONG_TRANSFER_TEST: "1"
        run: go test -run TestQUICLoopbackParallelTransfer -count=1 -timeout=8m .
