name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/p2p-friend-linux-amd64 .

      - name: Build Linux arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/p2p-friend-linux-arm64 .

      - name: Build Windows amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/p2p-friend-windows-amd64.exe .

      - name: Compile Windows amd64 tests
        run: GOOS=windows GOARCH=amd64 go test -c -o /tmp/p2p-friend-windows.test.exe .

      - name: Build macOS amd64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /tmp/p2p-friend-darwin-amd64 .

      - name: Build macOS arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/p2p-friend-darwin-arm64 .

  linux-long-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Sustained resilient LAN transfer
        env:
          P2PF_LONG_TRANSFER_TEST: "1"
        run: go test -run TestQUICLoopbackParallelTransfer -count=1 -timeout=8m .

  windows-long-transfer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Sustained QUIC transfer
        shell: pwsh
        env:
          P2PF_LONG_TRANSFER_TEST: "1"
        run: go test -run TestQUICLoopbackParallelTransfer -count=1 -timeout=8m .


  perf-2gib-loopback:
    name: 2GiB QUIC ${{ matrix.os }} loopback
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      P2PF_PERF_TEST: "1"
      P2PF_PERF_BYTES: "2147483648"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Download dependencies
        run: go mod download
      - name: Record runner environment
        run: |
          go version
          go env GOOS GOARCH
          python -c "import platform,os; print(platform.platform(), platform.processor(), os.cpu_count())"
      - name: A/B 2 GiB transfer on same runner (A-B-B-A)
        shell: bash
        env:
          P2PF_PERF_BASELINE_SHA: "5f95d303aa82394d70e8d434a65e1d5d3d4c4d36"
        run: |
          set -euo pipefail
          git cat-file -e "${P2PF_PERF_BASELINE_SHA}:data.go"
          iteration=0
          for variant in baseline optimized optimized baseline; do
            iteration=$((iteration + 1))
            echo "=== P2PF_AB_BEGIN iteration=${iteration} variant=${variant} ==="
            if [ "${variant}" = baseline ]; then
              git show "${P2PF_PERF_BASELINE_SHA}:data.go" > data.go
            else
              git show "HEAD:data.go" > data.go
            fi
            P2PF_PERF_ARTIFACT_DIR="${{ runner.temp }}/p2pf-performance/${iteration}-${variant}" \
              go test -run TestPerfQUIC2GiBLoopback -count=1 -timeout=40m -v .
            echo "=== P2PF_AB_END iteration=${iteration} variant=${variant} ==="
          done
      - name: Upload performance results and CPU profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2pf-performance-${{ matrix.os }}
          path: ${{ runner.temp }}/p2pf-performance/
          if-no-files-found: warn
          retention-days: 14
