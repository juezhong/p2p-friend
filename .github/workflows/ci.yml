name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/p2p-friend-linux-amd64 .

      - name: Build Linux arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/p2p-friend-linux-arm64 .

      - name: Build Windows amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/p2p-friend-windows-amd64.exe .

      - name: Compile Windows amd64 tests
        run: GOOS=windows GOARCH=amd64 go test -c -o /tmp/p2p-friend-windows.test.exe .

      - name: Build macOS amd64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /tmp/p2p-friend-darwin-amd64 .

      - name: Build macOS arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/p2p-friend-darwin-arm64 .

  linux-long-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Sustained resilient LAN transfer
        env:
          P2PF_LONG_TRANSFER_TEST: "1"
        run: go test -run TestQUICLoopbackParallelTransfer -count=1 -timeout=8m .

  windows-long-transfer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Sustained QUIC transfer
        shell: pwsh
        env:
          P2PF_LONG_TRANSFER_TEST: "1"
        run: go test -run TestQUICLoopbackParallelTransfer -count=1 -timeout=8m .


  perf-2gib-loopback:
    name: 2GiB QUIC ${{ matrix.os }} loopback
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      P2PF_PERF_TEST: "1"
      P2PF_PERF_BYTES: "2147483648"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Download dependencies
        run: go mod download
      - name: Record runner environment
        run: |
          go version
          go env GOOS GOARCH
          python -c "import platform,os; print(platform.platform(), platform.processor(), os.cpu_count())"
      - name: Single 2 GiB PUT + GET regression
        env:
          P2PF_PERF_ARTIFACT_DIR: ${{ runner.temp }}/p2pf-performance
        run: go test -run TestPerfQUIC2GiBLoopback -count=1 -timeout=40m -v .
      - name: Upload performance results and CPU profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2pf-performance-${{ matrix.os }}
          path: ${{ runner.temp }}/p2pf-performance/
          if-no-files-found: warn
          retention-days: 14

  windows-perf-diagnostics:
    # M2: Observe bottlenecks before changing WinSock/QUIC parameters.
    name: Windows 2GiB transfer profiling (M2)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      P2PF_PERF_TEST: "1"
      P2PF_PERF_BYTES: "2147483648"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Download dependencies
        run: go mod download
      - name: Runner details and UDP baseline
        shell: pwsh
        env:
          P2PF_DIAG_ROOT: ${{ runner.temp }}/p2pf-windows-diag
        run: |
          New-Item -ItemType Directory -Force -Path $env:P2PF_DIAG_ROOT | Out-Null
          go version
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
          netstat -s -p udp | Out-File (Join-Path $env:P2PF_DIAG_ROOT "udp-before.txt") -Encoding utf8
      - name: Windows repeat 2GiB PUT/GET with block mutex and heap profiles
        shell: pwsh
        env:
          P2PF_DIAG_ROOT: ${{ runner.temp }}/p2pf-windows-diag
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($i in 1..2) {
            $dir = Join-Path $env:P2PF_DIAG_ROOT "repeat-$i"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $env:P2PF_PERF_ARTIFACT_DIR = $dir
            Write-Output "=== P2PF_WINDOWS_M2_BEGIN repeat=$i commit=$env:GITHUB_SHA ==="
            & go test -run TestPerfQUIC2GiBLoopback -count=1 -timeout=15m -v -blockprofile (Join-Path $dir "block.pprof") -blockprofilerate=1000000 -mutexprofile (Join-Path $dir "mutex.pprof") -mutexprofilefraction=10 -memprofile (Join-Path $dir "heap.pprof") .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output "=== P2PF_WINDOWS_M2_END repeat=$i ==="
          }
      - name: Extract CPU and blocking hotspot tables
        if: always()
        shell: pwsh
        env:
          P2PF_DIAG_ROOT: ${{ runner.temp }}/p2pf-windows-diag
        run: |
          if (!(Test-Path $env:P2PF_DIAG_ROOT)) { exit 0 }
          netstat -s -p udp | Out-File (Join-Path $env:P2PF_DIAG_ROOT "udp-after.txt") -Encoding utf8
          Get-ChildItem -Path $env:P2PF_DIAG_ROOT -Recurse -Filter "*.pprof" | ForEach-Object {
            $profile = $_.FullName
            Write-Output "=== P2PF_PROFILE $profile ==="
            $top = & go tool pprof -top -cum -nodecount=30 $profile 2>&1
            $top | Out-File ($profile + ".cum.txt") -Encoding utf8
            if ($_.Name -match "cpu|block|mutex") { $top | Select-Object -First 35 }
          }
          Get-ChildItem -Path $env:P2PF_DIAG_ROOT -Recurse -Filter "result.json" | ForEach-Object {
            $json = Get-Content $_.FullName -Raw | ConvertFrom-Json
            foreach ($transfer in $json.transfers) {
              Write-Output ("P2PF_WINDOWS_M2_RESULT dir={0} mibps={1:N2} alloc_mib={2:N1} gc={3}" -f $transfer.direction, $transfer.mib_per_second, $transfer.allocated_mib, $transfer.num_gc)
            }
          }
      - name: Upload Windows M2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2pf-windows-m2-profiles
          path: ${{ runner.temp }}/p2pf-windows-diag/
          if-no-files-found: warn
          retention-days: 14
