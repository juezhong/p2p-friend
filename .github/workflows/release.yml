name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            PUBLISH=true
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
            [[ -n "$VERSION" ]] || { echo "VERSION is empty" >&2; exit 1; }
            TAG="v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "${TAG} already exists; nothing to publish from main."
              PUBLISH=false
            else
              PUBLISH=true
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Download dependencies
        run: go mod download

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: |
          go test ./...
          go vet ./...

      - name: Build release binaries
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.appVersion=${VERSION}" \
            -o dist/p2p-friend-linux-amd64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.appVersion=${VERSION}" \
            -o dist/p2p-friend-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.appVersion=${VERSION}" \
            -o dist/p2p-friend-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.appVersion=${VERSION}" \
            -o dist/p2p-friend-darwin-arm64 .
          (cd dist && sha256sum p2p-friend-* > SHA256SUMS.txt)

      - name: Create version tag
        if: ${{ steps.version.outputs.publish == 'true' && !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/p2p-friend-linux-amd64 \
              dist/p2p-friend-windows-amd64.exe \
              dist/p2p-friend-darwin-amd64 \
              dist/p2p-friend-darwin-arm64 \
              dist/SHA256SUMS.txt --clobber
          elif [[ -f "$NOTES" ]]; then
            gh release create "$TAG" \
              dist/p2p-friend-linux-amd64 \
              dist/p2p-friend-windows-amd64.exe \
              dist/p2p-friend-darwin-amd64 \
              dist/p2p-friend-darwin-arm64 \
              dist/SHA256SUMS.txt \
              --verify-tag --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              dist/p2p-friend-linux-amd64 \
              dist/p2p-friend-windows-amd64.exe \
              dist/p2p-friend-darwin-amd64 \
              dist/p2p-friend-darwin-arm64 \
              dist/SHA256SUMS.txt \
              --verify-tag --title "$TAG" --generate-notes
          fi
