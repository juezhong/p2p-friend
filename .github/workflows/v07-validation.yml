name: v0.7 Validation

on:
  push:
    branches:
      - feat/v0.7-quic-transport

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false

      - name: Tidy modules
        run: |
          go mod tidy
          echo '--- GO_MOD_BEGIN ---'
          cat go.mod
          echo '--- GO_MOD_END ---'
          echo '--- GO_SUM_BEGIN ---'
          cat go.sum
          echo '--- GO_SUM_END ---'

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/p2p-friend-linux-amd64 .

      - name: Build Windows
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/p2p-friend-windows-amd64.exe .

      - name: Compile Windows tests
        run: GOOS=windows GOARCH=amd64 go test -c -o /tmp/p2p-friend-windows.test.exe .
